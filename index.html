<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chris Godek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #ffffff; --text: #1a1a1a; --muted: #666; --link: #1a5fb4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --text: #eaeaea; --muted: #9a9a9a; --link: #78aeed; }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.65 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    main { max-width: 640px; margin: 0 auto; padding: 18vh 16px 48px; }
    h1 { font-size: 2.4rem; font-weight: 600; margin: 0 0 1.5rem; letter-spacing: -0.02em; }
    h2 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.5rem; }
    ul { margin: 0; padding-left: 1.2em; }
    li { margin: 0.35rem 0; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .updated { color: var(--muted); font-size: 0.85em; }
  </style>
</head>
<body>
  <main>
    <h1>Chris Godek</h1>
    <h2>Apps</h2>
    <ul>
      <li><a data-built href="/seating-chart/">Seating Chart</a> <span class="updated">· <a href="/seating-chart/updates.html">What's new</a></span></li>
    </ul>
  </main>
  <script>
    // Show each app's last build date, read from its GitHub Pages Last-Modified header.
    document.querySelectorAll('li a[data-built]').forEach(function (a) {
      fetch(a.href, { method: 'HEAD', cache: 'no-store' })
        .then(function (r) {
          var date = new Date(r.headers.get('Last-Modified'));
          if (isNaN(date)) return;
          var span = document.createElement('span');
          span.className = 'updated';
          span.textContent = '— updated ' + date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          a.after(' ', span);
        })
        .catch(function () {});
    });
  </script>
</body>
</html>
