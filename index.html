<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chris Godek</title>
  <style>
    :root { --bg: #ffffff; --text: #1a1a1a; --muted: #666; --link: #1a5fb4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --text: #eaeaea; --muted: #9a9a9a; --link: #78aeed; }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 18vh 16px 48px; }
    h1 { font-size: 2.4rem; font-weight: 600; margin: 0 0 1.5rem; letter-spacing: -0.01em; }
    h2 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.5rem; }
    ul { margin: 0; padding-left: 1.2em; }
    li { margin: 0.35rem 0; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .updated { color: var(--muted); font-size: 0.85em; margin-left: 0.4em; }
  </style>
</head>
<body>
  <main>
    <h1>Chris Godek</h1>
    <h2>Apps</h2>
    <ul>
      <li data-repo="seating-chart"><a href="https://chrisgodek.github.io/seating-chart/">Seating Chart</a></li>
    </ul>
  </main>
  <script>
    // Show each app's last update date, read from its GitHub repo's latest commit.
    document.querySelectorAll('li[data-repo]').forEach(function (li) {
      fetch('https://api.github.com/repos/chrisgodek/' + li.dataset.repo + '/commits?per_page=1')
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (commits) {
          var date = new Date(commits[0].commit.committer.date);
          var span = document.createElement('span');
          span.className = 'updated';
          span.textContent = '— updated ' + date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          li.appendChild(span);
        })
        .catch(function () {});
    });
  </script>
</body>
</html>
